name: Recon image

# R-15: build the reconstruction service image and smoke-test the container on every PR that can
# change it; on main, also publish it to GHCR. Publishing starts no GPU -- deploying is a separate,
# manual workflow (deploy-recon.yml).

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/container_entrypoint.sh
      - requirements.txt
      - requirements-gpu.txt
      - pyproject.toml
      - recon/**
      - .github/workflows/recon-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/container_entrypoint.sh
      - requirements.txt
      - requirements-gpu.txt
      - pyproject.toml
      - recon/**
      - .github/workflows/recon-image.yml

permissions:
  contents: read

env:
  IMAGE: ghcr.io/proofshape/proofshape-recon

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The CUDA PyTorch base image alone is several GB; the default runner disk is too tight
      # without clearing toolchains this job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - name: Build image
        run: |
          docker build \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --tag proofshape-recon:ci \
            .

      - name: Check the image's Python stack
        run: |
          docker run --rm --entrypoint python proofshape-recon:ci -c "
          import cv2, torch, vggt, recon.service
          print('torch', torch.__version__, 'cv2', cv2.__version__)
          assert torch.__version__.startswith('2.8.0'), torch.__version__
          "

      # CPU-only runner: skip the model prefetch and prove the service answers the frozen
      # contract from inside the real container.
      - name: Smoke-test the running container
        run: |
          docker run --detach --name recon-smoke --publish 8000:8000 \
            --env PROOFSHAPE_PREFETCH_MODEL=0 proofshape-recon:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8000/openapi.json > /dev/null; then
              break
            fi
            sleep 2
          done
          status=$(curl --silent --output /tmp/session.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"order_code": "R15-CI"}' \
            http://localhost:8000/v1/sessions)
          cat /tmp/session.json; echo
          if [ "$status" != "201" ]; then
            docker logs recon-smoke
            echo "createSession returned HTTP $status, expected 201" >&2
            exit 1
          fi

      - name: Publish to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker tag proofshape-recon:ci "${IMAGE}:sha-${GITHUB_SHA}"
          docker tag proofshape-recon:ci "${IMAGE}:main"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:main"
