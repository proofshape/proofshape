name: TypeScript CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for a TypeScript project
        id: detect
        run: |
          if [ -f capture/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: capture/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        working-directory: capture
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript type check
        if: steps.detect.outputs.exists == 'true'
        working-directory: capture
        run: npm run typecheck

      - name: ESLint
        if: steps.detect.outputs.exists == 'true'
        working-directory: capture
        run: npm run lint

      - name: Prettier
        if: steps.detect.outputs.exists == 'true'
        working-directory: capture
        run: npm run format:check

      - name: Vitest
        if: steps.detect.outputs.exists == 'true'
        working-directory: capture
        run: npm test
