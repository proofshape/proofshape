name: C-17 sample helper

on:
  pull_request:
    paths:
      - capture/src/order-sheet.ts
      - capture/src/order-sheet.test.ts
      - capture/package-lock.json
      - .github/workflows/c17-sample-helper.yml

permissions:
  contents: write

jobs:
  sample:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: capture/package-lock.json
      - working-directory: capture
        run: npm ci
      - name: Generate deterministic C-17 sample
        working-directory: capture
        env:
          PROOFSHAPE_WRITE_C17_SAMPLE: "1"
        run: npx vitest run src/order-sheet.test.ts
      - name: Commit sample and remove this temporary helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures/order_sheet_PO-48213-A.pdf
          git rm .github/workflows/c17-sample-helper.yml
          git commit -m "C-17: commit deterministic order-sheet sample"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
