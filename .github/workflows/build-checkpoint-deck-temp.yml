name: Build checkpoint presentation

on:
  push:
    branches:
      - chore/checkpoint-presentation
    paths:
      - scripts/build_checkpoint_deck_temp.py
      - .github/workflows/build-checkpoint-deck-temp.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/checkpoint-presentation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install presentation dependency
        run: python -m pip install python-pptx
      - name: Build and validate deck
        run: |
          mkdir -p submissions
          python scripts/build_checkpoint_deck_temp.py
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p = Path("submissions/2026-10-29-checkpoint-deck.pptx")
          assert p.exists() and p.stat().st_size > 10000
          with ZipFile(p) as z:
              names = z.namelist()
              assert "ppt/presentation.xml" in names
              assert len([n for n in names if n.startswith("ppt/slides/slide") and n.endswith(".xml")]) == 10
          print(f"validated {p} ({p.stat().st_size} bytes, 10 slides)")
          PY
      - name: Commit only the finished submission
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions/2026-10-29-checkpoint-deck.pptx
          git rm scripts/build_checkpoint_deck_temp.py .github/workflows/build-checkpoint-deck-temp.yml
          git commit -m "Add 2026-10-29 checkpoint presentation deck"
          git push origin HEAD:chore/checkpoint-presentation
