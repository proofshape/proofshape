name: C-17 format helper

on:
  pull_request:
    paths:
      - capture/src/buyer.ts
      - capture/src/order-sheet.ts
      - capture/src/pages-build.test.ts
      - .github/workflows/c17-format-helper.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: capture/package-lock.json
      - working-directory: capture
        run: npm ci
      - name: Apply repository Prettier rules
        working-directory: capture
        run: npx prettier --write src/buyer.ts src/order-sheet.ts src/pages-build.test.ts
      - name: Commit formatting and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capture/src/buyer.ts capture/src/order-sheet.ts capture/src/pages-build.test.ts
          git rm .github/workflows/c17-format-helper.yml
          git commit -m "C-17: apply capture formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
