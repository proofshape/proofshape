name: C-17 lock helper

on:
  push:
    branches:
      - capture/C-17-order-sheet-impl
    paths:
      - capture/package.json
      - .github/workflows/c17-lock-helper.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: capture/package-lock.json
      - name: Generate lockfile
        working-directory: capture
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: c17-package-lock
          path: capture/package-lock.json
          if-no-files-found: error
