[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofshape"
version = "0.1.0"
description = "Phone-based 3D capture and inspection for manufactured parts."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["numpy>=1.26,<2", "pytest>=8", "pyyaml>=6", "jsonschema>=4", "openapi-spec-validator>=0.7", "ruff>=0.16"]

# Only `recon` is registered as an installed package for now. `inspect` is
# deliberately left out — see docs/decisions.md D-030: its directory name
# collides with the Python standard library `inspect` module, and installing
# it as a top-level package would shadow that module for the whole
# environment. The import name for inspect-lane code is a decision for I-01,
# once there is real code to import.
[tool.setuptools.packages.find]
include = ["recon*"]
