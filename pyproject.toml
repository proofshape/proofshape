[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofshape"
version = "0.1.0"
description = "Phone-based 3D capture and inspection for manufactured parts."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["numpy>=1.26,<2", "pytest>=8", "pyyaml>=6", "jsonschema>=4", "openapi-spec-validator>=0.7", "ruff>=0.16", "pypdfium2>=5"]

# `inspect/` itself is still never registered — see docs/decisions.md D-030: its directory name
# collides with the Python standard library `inspect` module, and installing it as a top-level
# package would shadow that module for the whole environment. D-053 settles the import name for
# inspect-lane code instead: package `inspection`, living at inspect/inspection/. `packages.find`
# can't discover a package whose name differs from its directory, so both packages are listed
# explicitly here, with `package-dir` mapping `inspection` to its real location.
[tool.setuptools]
packages = ["recon", "inspection"]

[tool.setuptools.package-dir]
inspection = "inspect/inspection"

# A-12: these two files run under LaS-Comp's Python 3.10 (D-057), not the service's 3.11. Ruff infers
# 3.11 from requires-python above, and its pyupgrade rules would then *push* 3.11-only APIs (e.g.
# `datetime.UTC`) into them. Pinning their target makes ruff check them as the 3.10 code they are.
[tool.ruff.per-file-target-version]
"recon/completion_contract.py" = "py310"
"scripts/lascomp_runner.py" = "py310"
